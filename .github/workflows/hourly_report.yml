name: Hourly Report

on:
  repository_dispatch:
    types: [hourly_report_trigger]
  workflow_dispatch: # Pemicu manual dari tab Actions GitHub

jobs:
  run-bot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright with dependencies (Chromium)
        run: |
          playwright install --with-deps chromium

      - name: Run Bot in Hourly Mode
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          TARGET_PHONE: ${{ secrets.TARGET_PHONE }}
          TARGET_PHONE_TK: ${{ secrets.TARGET_PHONE_TK }}
          AGRIPAM_BASE_URL: ${{ vars.AGRIPAM_BASE_URL }}
          PUBLIC_READ_TOKEN: ${{ secrets.PUBLIC_READ_TOKEN }}
          GRAFIK_URL: ${{ vars.GRAFIK_URL }}
          REKAP_CRO_URL: ${{ vars.REKAP_CRO_URL }}
          REKAP_TK_PANEN_URL: ${{ vars.REKAP_TK_PANEN_URL }}
          ENABLE_TK_PANEN: ${{ vars.ENABLE_TK_PANEN }}
          TK_PANEN_BELUM_LAPOR_JENIS: ${{ vars.TK_PANEN_BELUM_LAPOR_JENIS }}
        run: |
          python bot.py hourly
