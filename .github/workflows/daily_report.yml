name: Daily Report

on:
  schedule:
    - cron: '10 15 * * *' # 15:10 UTC = 22:10 WIB setiap hari
  workflow_dispatch: # Pemicu manual dari tab Actions GitHub

jobs:
  run-bot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright with dependencies (Chromium)
        run: |
          playwright install --with-deps chromium

      - name: Run Bot in Daily Mode
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          TARGET_PHONE: ${{ secrets.TARGET_PHONE }}
        run: |
          python bot.py daily_2210
